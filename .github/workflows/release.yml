# v0.2.0 のようなタグを push するか、Actions の画面で「Run workflow」を押すと、
# package.json の version で Windows 用インストーラーを作り、GitHub の Releases に下書きとして載せる。
# 下書きを「公開」にすると、そのときに同じ名前のタグが作られ、利用者のアプリが自動アップデートで拾う。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - run: npm run notices
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
