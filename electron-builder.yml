appId: io.github.kono0.sittaka
productName: Sittaka
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - '!**/*.map'
# sherpa-onnx はネイティブモジュールと DLL を一緒に読むので asar の外に出す。
# kuromoji の辞書もファイルとして読むので外に出しておく。
# ライセンス表記とプライバシーポリシーをインストール先に置く（resources フォルダの中）
extraResources:
  - THIRD_PARTY_NOTICES.md
  - PRIVACY.md
asarUnpack:
  - node_modules/sherpa-onnx-*/**
  - node_modules/kuromoji/dict/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Sittaka-Setup-${version}.${ext}
  shortcutName: Sittaka
mac:
  icon: resources/icon.png
publish:
  provider: github
  owner: kono0
  repo: Sittaka
