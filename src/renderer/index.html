<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' blob: data: https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'"
    />
    <title>Talking Word</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <select id="engine"></select>
      <button id="toggle">開始</button>
    </header>
    <section class="meters">
      <label>相手 <meter id="level-other" min="0" max="0.3" value="0"></meter></label>
      <label>自分 <meter id="level-self" min="0" max="0.3" value="0"></meter></label>
    </section>
    <p id="status">エンジンを選んで「開始」を押してください。</p>
    <section class="board">
      <h2>キープ</h2>
      <div id="kept" class="chips" data-empty="気になる言葉を押すか Ctrl+Alt+数字 でここに残せます"></div>
      <h2>聞こえた言葉</h2>
      <div id="words" class="chips" data-empty="会話の中の専門用語やカタカナ語がここに流れてきます"></div>
    </section>
    <details id="log">
      <summary>会話ログ</summary>
      <ol id="transcript"></ol>
      <footer id="stats"></footer>
    </details>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
